<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen app in a single centered column. Look: cut-out stickers, thick ink outline + hard drop shadow. Single theme by choice. */
  --ink:#1b2145;
  --paper:#fffaf0;
  --sun:#ffc93c;
  --coral:#ff6b5e;
  --mint:#3ccf91;
  --sky:#6ec6ff;
  --grape:#7a5cff;
  --display:'Fredoka','Rubik','Arial Rounded MT Bold','Varela Round',system-ui,sans-serif;
  --body:'Fredoka','Rubik','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--sky);font-size:18px;overflow-x:hidden;transition:background .4s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* backgrounds: home scenes and worlds */
.bg-meadow{background:linear-gradient(#8fdcff 0 58%,#7ed957 58% 100%)}
.bg-beach{background:linear-gradient(#9be7ff 0 50%,#4fc3f7 50% 62%,#ffe29a 62% 100%)}
.bg-night{background:radial-gradient(circle at 80% 15%,#fff7c2 0 34px,transparent 36px),linear-gradient(#1b2145 0 60%,#2e3a7a 60% 100%)}
.bg-candy{background:linear-gradient(#ffc1e3 0 55%,#ffe9a8 55% 100%)}
.bg-rainbow{background:linear-gradient(#ff9aa2 0 16%,#ffcf9a 16% 32%,#fff3a0 32% 48%,#b5ecb0 48% 64%,#a8d8ff 64% 80%,#cdb8ff 80% 100%)}
.bg-volcano{background:radial-gradient(circle at 50% 100%,#ffb52e 0 18%,transparent 42%),linear-gradient(#5a1a2b 0 60%,#2b0f18 60% 100%)}
.bg-deepsea{background:linear-gradient(#35c3ff,#0b2a6b)}
.bg-galaxy{background:radial-gradient(#fff 1.5px,transparent 2px) 0 0/90px 90px,radial-gradient(#ffe9a8 1px,transparent 2px) 40px 50px/130px 130px,linear-gradient(#3a2b8c,#120c3a)}
.bg-snow{background:radial-gradient(#fff 3px,transparent 4px) 0 0/70px 70px,linear-gradient(#bfe6ff 0 60%,#ffffff 60% 100%)}
.bg-map{background:linear-gradient(160deg,#6ec6ff,#7a5cff)}
.bg-jungle{background:linear-gradient(#35c07a,#0f6b45)}
.bg-ocean{background:linear-gradient(#5fd0ff,#1463b8)}
.bg-space{background:radial-gradient(#fff 1.5px,transparent 2px) 0 0/90px 90px,radial-gradient(#ffe9a8 1px,transparent 2px) 40px 50px/130px 130px,linear-gradient(#3a2b8c,#120c3a)}
.bg-castle{background:linear-gradient(#f7a3bf,#8d5cc9)}
.bg-dino{background:linear-gradient(#ffb25e,#c2452d)}
.bg-clock{background:linear-gradient(#5fe0d0,#127a8a)}
.bg-nature{background:linear-gradient(#ffe48a,#35b8c9)}

#app{max-width:720px;min-height:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 18px;font-weight:700;font-size:1.05rem;min-height:52px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{padding:6px 14px;min-height:44px;font-size:.95rem;box-shadow:0 4px 0 var(--ink)}
.btn.sun{background:var(--sun)}
.btn.mint{background:var(--mint)}
.btn.coral{background:var(--coral);color:#fff}
.btn.big{font-size:1.7rem;padding:16px 28px;border-radius:26px;box-shadow:0 7px 0 var(--ink)}

.logo{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,11vw,4.4rem);line-height:.95;margin:8px 0 0;text-align:center;color:var(--sun);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;letter-spacing:.01em;text-wrap:balance}
.title{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}

.hero{position:relative;display:inline-block;line-height:1}
.hero .hat{position:absolute;top:-.46em;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:.55em}
.hero .pet{position:absolute;bottom:0;inset-inline-end:-.6em;font-size:.42em}
.hero .ride{position:absolute;bottom:-.1em;inset-inline-start:-.6em;font-size:.45em}
.hero .toy{position:absolute;top:.02em;inset-inline-end:-.55em;font-size:.36em}
.home-hero{text-align:center;font-size:clamp(6rem,30vw,10rem);padding-top:.4em;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.menu{display:flex;flex-direction:column;align-items:center;gap:14px}
.menu .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.foot{margin-top:auto;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:.9rem}
.foot .note{background:var(--paper);border-radius:10px;padding:2px 10px}

/* world map */
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.world{display:flex;align-items:center;gap:14px;text-align:start;border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;color:#fff;min-height:120px}
.world:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.world .ic{font-size:3.4rem;line-height:1}
.world b{display:block;font-size:1.35rem;font-family:var(--display);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.world small{display:block;margin-top:6px;background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:600;width:fit-content}
.world.locked{filter:grayscale(.85);opacity:.85}

.path{display:flex;flex-direction:column;gap:14px;align-items:center}
.stage{width:min(100%,420px);display:flex;align-items:center;gap:14px;text-align:start}
.stage:nth-child(even){margin-inline-start:14%}
.stage:nth-child(odd){margin-inline-end:14%}
.stage .n{width:44px;height:44px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.stage .ic{font-size:1.6rem}
.stage .nm{flex:1}
.stage .st{letter-spacing:2px;white-space:nowrap}
.stage[disabled]{opacity:.55;cursor:not-allowed}
.off{opacity:.25}

/* play */
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--sun)}
.prompt{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:1.4rem;font-weight:700}
.prompt span{flex:1;text-wrap:balance}
.vis{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.88);border:3px solid var(--ink);border-radius:26px;padding:16px}
.vis .big{font-size:5rem;line-height:1.1}
.vis .row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:240px;font-size:2.1rem;line-height:1.15}
.grp .gone{opacity:.3;position:relative}
.grp .gone::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:var(--coral);opacity:1;font-weight:700}
.grp.many{display:grid;grid-template-columns:repeat(5,auto);font-size:1.5rem;max-width:none}
.wd{font-size:1.45rem;font-weight:700;letter-spacing:.04em}
.tm{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.digital{font-size:3.6rem;font-weight:700;background:var(--ink);color:var(--sun);border-radius:18px;padding:4px 26px;font-variant-numeric:tabular-nums}
.bigword{font-size:3.2rem;font-weight:700;letter-spacing:.06em}
.op,.eq{font-size:2.2rem;font-weight:700}
.shell{font-size:5.5rem;font-weight:700;line-height:1;background:var(--sun);border:4px solid var(--ink);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center}
.word{display:flex;gap:8px;font-size:2.6rem;font-weight:700}
.word b{min-width:1.1em;text-align:center;border-bottom:4px solid var(--ink)}
.word b.q{background:var(--sun);border:3px dashed var(--ink);border-radius:10px;color:var(--coral)}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:3rem;font-weight:700}
.seq .q{width:1.4em;height:1.4em;display:grid;place-items:center;background:var(--sun);border:3px dashed var(--ink);border-radius:14px;color:var(--coral)}
.sh{width:1.25em;height:1.25em;display:block}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px}
.opt{min-height:104px;font-size:2.8rem;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.opt small{font-size:1rem;font-weight:600}
.opt .grp{font-size:1.7rem}
.opt.right{background:var(--mint);animation:pop .45s}
.opt.wrong{background:#ffd3cf;opacity:.55;animation:shake .35s}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.buddy{position:fixed;bottom:8px;inset-inline-end:28px;font-size:3rem;pointer-events:none;z-index:2}
.buddy.yay{animation:jump .6s}
@keyframes jump{40%{transform:translateY(-34px) rotate(8deg)}}

.cards{display:grid;gap:12px;flex:1;align-content:center}
.card{aspect-ratio:1;font-size:clamp(2rem,9vw,3.4rem);padding:0;background:var(--grape);border-radius:20px}
.card.open{background:var(--paper)}
.card.done{background:var(--mint)}
.gems{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;align-content:center;max-width:460px;width:100%;margin:0 auto}
.gem{aspect-ratio:1.25;border-radius:28px;font-size:3.4rem;opacity:.72}
.gem.lit{opacity:1;transform:scale(1.07);box-shadow:0 0 0 8px #fff,0 5px 0 var(--ink)}

/* result, shop, stickers */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.panel h2{font-family:var(--display);font-size:2.4rem;margin:0}
.stars{font-size:4rem;line-height:1;letter-spacing:6px}
.stars span{display:inline-block;animation:starin .5s both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.gain{font-size:1.5rem;font-weight:700}
.newst{background:var(--sun);border:3px dashed var(--ink);border-radius:18px;padding:8px 18px;font-weight:700}
.newst em{font-style:normal;font-size:2.4rem;vertical-align:middle}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tabs .btn[aria-pressed="true"]{background:var(--sun)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;min-height:118px}
.item .e{font-size:2.8rem;line-height:1.1}
.item .p{font-size:.95rem}
.item.own{background:#e6fff3}
.item.eq{background:var(--mint)}
.item.poor{opacity:.6}
.preview{align-self:center;font-size:5rem;padding:.5em .7em .1em;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:26px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.slot{aspect-ratio:1;display:grid;place-items:center;font-size:2rem;background:var(--paper);border:3px dashed var(--ink);border-radius:18px}
.slot.got{border-style:solid;background:var(--sun);transform:rotate(-3deg)}
.slot.got:nth-child(even){transform:rotate(4deg)}
.wlabel{color:#fff;font-weight:700;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;font-size:1.15rem;margin:6px 0 -6px}
.msg{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:600;text-align:center;align-self:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 abc(){const ls=letters(),i=1+rnd(ls.length-1);return {key:'ab'+i,q:t('q_abc',ls[i]),vis:`<div class="seq"><span class="q">?</span><span>${ls[i]}</span></div>`,opts:letterOpts(ls[i-1],4)}},
 spellpick(){let e,w,alts,g=0;do{[e,w]=pick(words());const u=up(w);alts=new Set();let k=0;while(alts.size<2&&k++<30){const x=shuffle([...u]).join('');if(x!==u)alts.add(x)}}while((w.length<3||w.length>6||alts.size<2)&&g++<80);
  const f=x=>`<span class="wd">${x}</span>`;return {key:'sp'+w,q:t('q_spellpick'),say:w+'. '+t('q_spellpick'),vis:`<div class="big">${e}</div>`,opts:emo(f(up(w)),[...alts].map(f))}},
 spell(){let e,w;do{[e,w]=pick(words())}while(w.length<3||w.length>5);const cs=[...up(w)],extra=pick(letters().filter(l=>!cs.includes(l)));
  return {key:'sl'+w,q:t('q_spell'),say:w+'. '+t('q_spell'),spell:cs,vis:`<div class="big">${e}</div><div class="word" id="spell">${cs.map(()=>'<b class="q">?</b>').join('')}</div>`,opts:shuffle([...cs,extra]).map(c=>({h:c,ch:c}))}},
 shapecount(){const pool=SHAPES.filter(x=>SHP_HE[x[0]]),s=pick(pool),n=1+rnd(6),o=sample(pool.filter(x=>x!==s),3),items=[...Array(n).fill(s),...Array.from({length:2+rnd(3)},()=>pick(o))];
  return {key:'sc'+s[0]+n,q:t('q_catcount',S.lang==='he'?SHP_HE[s[0]]:s[1]+'s'),vis:`<div class="seq" style="font-size:2rem;max-width:420px">${shuffle(items).map(x=>shapeSVG(x[0],pick(COLORS)[1])).join('')}</div>`,opts:numOpts(n,1,7)}},
 patternmid(){const ss=sample(SHAPES,3),cs=sample(COLORS,3),tok=ss.map((x,i)=>shapeSVG(x[0],cs[i][1])),tpl=pick(['AB','ABC','AAB','ABB']),p=2+rnd(4),seq=[];for(let i=0;i<7;i++)seq.push('ABC'.indexOf(tpl[i%tpl.length]));
  return {key:'pm'+tpl+ss[0][0]+p,q:t('q_pattern'),vis:`<div class="seq" style="font-size:2.4rem">${seq.map((x,i)=>i===p?'<span class="q">?</span>':tok[x]).join('')}</div>`,opts:shuffle([0,1,2]).map(i=>({h:tok[i],ok:i===seq[p]}))}},
 sidesum(){const L=[['triangle',3],['square',4],['pentagon',5],['hexagon',6],['rect',4],['diamond',4]],x=pick(L),y=pick(L);
  return {key:'ss'+x[0]+y[0],q:t('q_sidesum'),vis:`<div class="row">${shapeSVG(x[0],pick(COLORS)[1],'5.5rem')}<span class="op">+</span>${shapeSVG(y[0],pick(COLORS)[1],'5.5rem')}</div>`,opts:numOpts(x[1]+y[1],6,12)}},
 middle(){const xs=pickSizes(3),mid=[...xs].sort((a,b)=>a[1]-b[1])[1];return {key:'mi'+xs.map(x=>x[0]).join(''),q:t('q_middle'),vis:'<div class="big">🔎</div>',opts:xs.map(x=>({h:x[0],ok:x===mid}))}},
 egg(){return {key:'eg',q:t('q_egg'),vis:'<div class="big">🥚</div>',opts:emo(pick(NAT.egg[0]),sample(NAT.egg[1],3))}},
 meat(){return {key:'me',q:t('q_meat'),vis:'<div class="big">🍖</div>',opts:emo(pick(NAT.meat[0]),sample(NAT.meat[1],3))}},
 legsum(){const [x,y]=sample(NAT.legs,2);return {key:'ls'+x[0]+y[0],q:t('q_legsum'),vis:`<div class="row"><span class="big">${x[0]}</span><span class="op">+</span><span class="big">${y[0]}</span></div>`,opts:nearOpts(x[1]+y[1],[2,-2,4,-4])}}
};

/* ---------- screens ---------- */
const app=document.getElementById('app');
function go(screen,extra){V=Object.assign({screen},extra||{});draw()}
function draw(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='he'?'rtl':'ltr';document.title=t('title');R[V.screen]()}
function setBg(c){document.body.className='bg-'+c}
const wallet=()=>`<span class="pill" id="coins">🪙 ${S.coins}</span><span class="pill">⭐ ${totalStars()}</span>`;
const backBar=(to,title)=>`<div class="bar"><button class="btn sm" data-a="go" data-v="${to}">◀ ${t('back')}</button><h2 class="title">${title}</h2><span class="sp"></span>${wallet()}</div>`;

const R={
 home(){setBg(S.eq.scene);
  app.innerHTML=`<div class="bar"><button class="btn sm" data-a="lang">🌐 ${t('other')}</button><button class="btn sm" data-a="sound" aria-label="sound">${S.sound?'🔊':'🔇'}</button><span class="sp"></span>${wallet()}</div>
  <h1 class="logo">${t('title')}</h1>
  <div class="home-hero">${heroHTML()}</div>
  <div class="menu"><button class="btn big sun" data-a="go" data-v="map">▶ ${t('play')}</button>
   <div class="row"><button class="btn" data-a="go" data-v="shop">🛍️ ${t('shop')}</button><button class="btn" data-a="go" data-v="album">📒 ${t('album')} ${Object.keys(S.stars).length}/${NSTK}</button></div></div>
  <div class="foot"><span class="note">${t('grown')}</span><button class="btn sm${V.sure?' coral':''}" data-a="reset">${V.sure?t('reset2'):t('reset')}</button></div>`},
 map(){setBg('map');const ts=totalStars();
  app.innerHTML=backBar('home',t('worlds'))+`<div class="worlds">${WORLDS.map((w,i)=>{const open=ts>=w.need;
   return `<button class="world bg-${w.id}${open?'':' locked'}" data-a="world" data-v="${i}"><span class="ic">${open?w.icon:'🔒'}</span><span><b>${t('w_'+w.id)}</b><small>${open?`${t('s_'+w.id)} · ⭐ ${worldStars(w)}/${w.stages.length*3}`:t('need',w.need)}</small></span></button>`}).join('')}</div>
   ${V.msg?`<div class="msg">${V.msg}</div>`:''}`},
 world(){const w=WORLDS[V.wi];setBg(w.id);
  app.innerHTML=backBar('map',w.icon+' '+t('w_'+w.id))+`<div class="path">${w.stages.map((s,i)=>{const st=S.stars[skey(w,i)]||0,open=i===0||skey(w,i) in S.stars||skey(w,i-1) in S.stars;
   return `<button class="btn stage" data-a="stage" data-v="${i}"${open?'':' disabled'}><span class="n">${open?i+1:'🔒'}</span><span class="ic">${KIND_IC[s.k]}</span><span class="nm">${t('k_'+(s.l||s.k))}</span><span class="st">${[1,2,3].map(n=>`<span class="${n>st?'off':''}">⭐</span>`).join('')}</span></button>`}).join('')}</div>`},
 quiz(){const q=G.q,pre=q.pre&&!G.shown;
  app.innerHTML=playBar(`<div class="dots">${Array.from({length:G.total},(_,i)=>`<i class="${i<G.n-1?'on':''}"></i>`).join('')}</div>`)+
  `<div class="prompt"><button class="btn sm" data-a="say" aria-label="listen">🔊</button><span>${pre?q.preQ:q.q}</span></div>
  <div class="vis">${pre?q.pre:q.vis}</div>
  <div class="opts"${pre?' style="visibility:hidden"':''}>${q.opts.map((o,i)=>`<button class="btn opt" data-a="ans" data-v="${i}">${o.h}</button>`).join('')}</div><div class="buddy" id="buddy">${heroHTML()}</div>`},
 memory(){const cols=G.a<=3?3:G.a>=10?5:4;
  app.innerHTML=playBar('<span class="sp"></span>')+`<div class="prompt"><button class="btn sm" data-a="say" aria-label="listen">🔊</button><span>${t('q_memory')}</span></div><div class="cards" id="cards" style="grid-template-columns:repeat(${cols},1fr)"></div>`;drawCards()},
 simon(){app.innerHTML=playBar(`<div class="dots">${Array.from({length:G.rounds},(_,i)=>`<i class="${i<G.round?'on':''}"></i>`).join('')}</div>`)+
  `<div class="prompt"><span id="smsg">${t('q_watch')}</span></div><div class="gems">${GEMS.map((g,i)=>`<button class="btn gem" data-a="gem" data-gem="${i}" data-v="${i}" style="background:${g[0]}">💎</button>`).join('')}</div><div class="buddy" id="buddy">${heroHTML()}</div>`},
 result(){const r=V.res,w=WORLDS[r.wi];setBg(w.id);
  app.innerHTML=`<div class="bar"><span class="sp"></span>${wallet()}</div><div class="panel"><div style="font-size:4.5rem">${heroHTML()}</div><h2>${t('r'+r.stars)}</h2>
  <div class="stars">${[1,2,3].map(n=>`<span class="${n>r.stars?'off':''}">⭐</span>`).join('')}</div><div class="gain">+${r.earn} 🪙</div>
  ${r.sticker?`<div class="newst">${t('newst')} <em>${r.sticker}</em></div>`:''}${r.newWorld?`<div class="newst">🔓 ${t('newworld')}</div>`:''}
  ${r.si<w.stages.length-1?`<button class="btn big sun" data-a="stage" data-v="${r.si+1}">${t('next')} ▶</button>`:''}
  <div class="menu"><div class="row"><button class="btn" data-a="stage" data-v="${r.si}">🔁 ${t('again')}</button><button class="btn" data-a="go" data-v="map">🗺️ ${t('map')}</button><button class="btn" data-a="go" data-v="shop">🛍️ ${t('shop')}</button></div></div></div>`},
 shop(){setBg(S.eq.scene);const cat=V.tab||'hero';
  app.innerHTML=backBar('home',t('shop'))+`<div class="preview">${heroHTML()}</div>
  <div class="tabs">${Object.keys(SHOP).map(c=>`<button class="btn sm" data-a="tab" data-v="${c}" aria-pressed="${c===cat}">${SHOP[c][c==='scene'?0:1][1]} ${t('t_'+c)}</button>`).join('')}</div>
  ${V.msg?`<div class="msg">${V.msg}</div>`:''}
  <div class="items">${SHOP[cat].map(it=>{const own=S.own[cat].includes(it[0]),eq=S.eq[cat]===it[0];
   return `<button class="btn item${eq?' eq':own?' own':S.coins<it[2]?' poor':''}" data-a="buy" data-v="${it[0]}"><span class="e">${it[1]}</span><span class="p">${eq?'✓ '+t('using'):own?t('use'):'🪙 '+it[2]}</span></button>`}).join('')}</div>`},
 album(){setBg(S.eq.scene);
  app.innerHTML=backBar('home',t('album'))+`<div class="msg">${t('got',Object.keys(S.stars).length,NSTK)}</div>`+WORLDS.map((w,wi)=>`<div class="wlabel">${w.icon} ${t('w_'+w.id)}</div><div class="album">${w.stages.map((_,si)=>{const got=skey(w,si) in S.stars;return `<div class="slot${got?' got':''}">${got?STK[w.id][si]:'?'}</div>`}).join('')}</div>`).join('')}
};
const playBar=mid=>`<div class="bar"><button class="btn sm" data-a="quit" aria-label="close">✕</button>${mid}<span class="pill" id="coins">🪙 ${S.coins}</span></div>`;
function updCoins(){const c=document.getElementById('coins');if(c)c.textContent='🪙 '+S.coins;const b=document.getElementById('buddy');if(b){b.classList.remove('yay');void b.offsetWidth;b.classList.add('yay')}}

/* ---------- play ---------- */
function startStage(wi,si){const st=WORLDS[wi].stages[si];setBg(WORLDS[wi].id);
  G={wi,si,k:st.k,a:st.a,b:st.b,usedK:new Set(),usedA:new Set(),usedV:new Set(),prevO:new Set(),n:0,total:6,miss:0,earn:0,lock:false};V={screen:'play'};
  if(st.k==='memory')return startMemory();if(st.k==='simon')return startSimon();nextQ()}
function nextQ(){if(G.n>=G.total)return finish();const q=freshQ();G.q=q;G.n++;G.lock=false;G.shown=false;G.pos=0;R.quiz();
  if(q.pre){G.lock=true;speak(q.preQ);later(()=>{G.shown=true;G.lock=false;R.quiz();speak(q.q)},q.preMs)}else speak(q.say||q.q)}
function earn(n){S.coins+=n;G.earn+=n;updCoins()}
function finish(){const stars=G.miss===0?3:G.miss<=2?2:1,w=WORLDS[G.wi],key=skey(w,G.si),before=totalStars(),first=!(key in S.stars);
  S.coins+=stars*10;G.earn+=stars*10;S.stars[key]=Math.max(S.stars[key]||0,stars);
  const res={wi:G.wi,si:G.si,stars,earn:G.earn};
  if(first)res.sticker=STK[w.id][G.si];
  const after=totalStars();res.newWorld=WORLDS.some(x=>x.need>before&&x.need<=after);
  save();G=null;sfx.win();go('result',{res,wi:res.wi})}

function startMemory(){const last=(S.rec&&S.rec.mem)||[],fresh=MEM.filter(e=>!last.includes(e)),es=sample(fresh.length>=G.a?fresh:MEM,G.a);S.rec=S.rec||{};S.rec.mem=es;G.cards=shuffle([...es,...es]).map(e=>({e,open:false,done:false}));G.first=-1;G.moves=0;R.memory();speak(t('q_memory'))}
function drawCards(){const el=document.getElementById('cards');if(!el)return;
  el.innerHTML=G.cards.map((c,i)=>`<button class="btn card${c.done?' done':c.open?' open':''}" data-a="card" data-v="${i}" aria-label="card ${i+1}">${c.open||c.done?c.e:'❔'}</button>`).join('')}
function startSimon(){G.round=0;G.rounds=3;R.simon();newRound()}
function newRound(){const len=G.a+G.round;G.seq=[];for(let i=0;i<len;i++){let v;do{v=rnd(4)}while(i&&v===G.seq[i-1]);G.seq.push(v)}playSeq()}
function smsg(k){const m=document.getElementById('smsg');if(m)m.textContent=t(k)}
function playSeq(){G.phase='watch';G.inp=0;smsg('q_watch');G.seq.forEach((v,i)=>later(()=>lite(v),700+i*650));later(()=>{G.phase='go';smsg('q_go');speak(t('q_go'))},700+G.seq.length*650)}
function lite(v){const el=document.querySelector(`[data-gem="${v}"]`);if(!el)return;el.classList.add('lit');tone(GEMS[v][1],.32);setTimeout(()=>el.classList.remove('lit'),380)}

/* ---------- actions ---------- */
const ACT={
 go(v){sfx.tap();go(v)},
 lang(){S.lang=S.lang==='en'?'he':'en';save();draw()},
 sound(){S.sound=!S.sound;save();draw();sfx.tap()},
 reset(){if(!V.sure){V.sure=true;return draw()}try{localStorage.removeItem(LS)}catch(e){}const lang=S.lang;load({coins:0});S.lang=lang;save();go('home')},
 world(v){const w=WORLDS[+v];if(totalStars()<w.need){sfx.bad();V.msg='🔒 '+t('need',w.need);return draw()}sfx.tap();go('world',{wi:+v})},
 stage(v){sfx.tap();startStage(V.wi,+v)},
 quit(){const wi=G?G.wi:V.wi;G=null;save();try{speechSynthesis.cancel()}catch(e){}go('world',{wi})},
 say(){speak(G&&G.q?(G.q.say||G.q.q):t('q_memory'))},
 ans(v,el){if(!G||G.lock||el.classList.contains('wrong')||el.classList.contains('right'))return;const o=G.q.opts[+v];
  if(G.q.spell){const sp=G.q.spell;if(o.ch===sp[G.pos]){el.classList.add('right');const b=document.querySelectorAll('#spell b')[G.pos];if(b){b.textContent=o.ch;b.classList.remove('q')}G.pos++;tone(500+G.pos*70,.1);
    if(G.pos===sp.length){G.lock=true;sfx.ok();earn(5);later(nextQ,1100)}}else{el.classList.add('wrong');G.miss++;sfx.bad();setTimeout(()=>el.classList.remove('wrong'),450)}return}
  if(o.ok){G.lock=true;el.classList.add('right');sfx.ok();earn(5);later(nextQ,950)}else{el.classList.add('wrong');G.miss++;sfx.bad()}},
 card(v){const i=+v,c=G.cards[i];if(G.lock||c.open||c.done)return;c.open=true;sfx.tap();
  if(G.first<0){G.first=i;return drawCards()}
  const f=G.cards[G.first];G.first=-1;G.moves++;
  if(f.e===c.e){f.done=c.done=true;drawCards();sfx.ok();earn(5);
   if(G.cards.every(x=>x.done)){const p=G.a;G.miss=G.moves<=Math.ceil(p*1.7)+1?0:G.moves<=Math.ceil(p*2.5)+1?1:3;later(finish,800)}}
  else{G.lock=true;drawCards();later(()=>{f.open=c.open=false;G.lock=false;drawCards()},950)}},
 gem(v){if(!G||G.phase!=='go')return;v=+v;lite(v);
  if(v===G.seq[G.inp]){G.inp++;if(G.inp===G.seq.length){G.phase='wait';G.round++;earn(10);later(()=>{sfx.ok();if(G.round>=G.rounds)finish();else{R.simon();newRound()}},500)}}
  else{G.miss++;G.phase='wait';later(()=>{sfx.bad();playSeq()},450)}},
 tab(v){sfx.tap();V.tab=v;V.msg='';draw()},
 buy(v){const cat=V.tab||'hero',it=item(cat,v);V.msg='';
  if(S.own[cat].includes(v)){S.eq[cat]=(S.eq[cat]===v&&cat!=='hero'&&cat!=='scene')?'':v;sfx.tap()}
  else if(S.coins>=it[2]){S.coins-=it[2];S.own[cat].push(v);S.eq[cat]=v;sfx.buy()}
  else{V.msg=t('poor',it[2]-S.coins);sfx.bad()}
  save();draw()}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;ACT[b.dataset.a](b.dataset.v,b)});

function start(seed){load(seed);go('home')}
if(typeof window!=='undefined'){
  window.claude?.hot?.snapshot?.(()=>S);
  window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
